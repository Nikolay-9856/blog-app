<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Заметки{% endblock %} — блог</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">✎ Заметки</a>
  <nav>
    <a href="{{ url_for('index') }}">Все посты</a>
    {% if g.user %}
      <a href="{{ url_for('feed') }}">Лента подписок</a>
      <a href="{{ url_for('create_post') }}" class="btn">Написать</a>
      <a href="{{ url_for('profile', username=g.user.username) }}">@{{ g.user.username }}</a>
      <a href="{{ url_for('logout') }}">Выйти</a>
    {% else %}
      <a href="{{ url_for('login') }}">Вход</a>
      <a href="{{ url_for('register') }}" class="btn">Регистрация</a>
    {% endif %}
  </nav>
</header>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
